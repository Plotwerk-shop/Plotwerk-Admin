services:
  - type: web
    name: plotwerk-admin
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 60 app:application
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.7
      - key: REQUIRE_POSTGRES
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: SHOPIFY_SHOP
        sync: false
      - key: SHOPIFY_CLIENT_ID
        sync: false
      - key: SHOPIFY_CLIENT_SECRET
        sync: false
      - key: ADMIN_CUSTOMER_ID
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: APP_PROXY_PATH
        value: /apps/plotwerk-admin
